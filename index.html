<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteBooks — Là où les histoires prennent vie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           VARIABLES & RESET
           ============================================ */
        :root {
            --color-primary: #1a1a2e;
            --color-secondary: #16213e;
            --color-accent: #e94560;
            --color-gold: #c9a96e;
            --color-cream: #faf8f5;
            --color-paper: #f5f0e8;
            --color-text: #2d2d2d;
            --color-text-light: #6b6b6b;
            --color-white: #ffffff;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', system-ui, sans-serif;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-text);
            background-color: var(--color-cream);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================
           HEADER & NAVIGATION
           ============================================ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--color-gold);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text);
            position: relative;
            padding-bottom: 4px;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-gold);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--color-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Menu hamburger pour mobile */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 2px;
            background: var(--color-primary);
            transition: var(--transition);
        }

        /* ============================================
           HERO SECTION — ACCUEIL
           ============================================ */
        .hero {
            margin-top: 70px;
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .hero-content {
            text-align: center;
            color: var(--color-white);
            position: relative;
            z-index: 1;
            padding: 2rem;
            max-width: 800px;
        }

        .hero-content h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .hero-content h1 em {
            font-style: italic;
            color: var(--color-gold);
        }

        .hero-content p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.85;
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--color-gold);
            color: var(--color-primary);
        }

        .btn-primary:hover {
            background: #b8956a;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 169, 110, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--color-white);
            border: 2px solid rgba(255,255,255,0.3);
            margin-left: 1rem;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--color-white);
        }

        /* ============================================
           SECTIONS COMMUNES
           ============================================ */
        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--color-text-light);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: var(--color-gold);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        /* ============================================
           HISTOIRES POPULAIRES
           ============================================ */
        .popular-stories {
            background: var(--color-white);
        }

        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .story-card {
            background: var(--color-cream);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            position: relative;
        }

        .story-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .story-card .card-image {
            height: 200px;
            background: linear-gradient(135deg, var(--color-secondary), var(--color-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .story-card .card-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }

        .story-card .card-image .icon {
            font-size: 3rem;
            color: var(--color-gold);
            position: relative;
            z-index: 1;
        }

        .story-card .card-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--color-gold);
            color: var(--color-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 2;
        }

        .story-card .card-content {
            padding: 1.8rem;
        }

        .story-card .card-category {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-gold);
            margin-bottom: 0.5rem;
        }

        .story-card h3 {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        .story-card p {
            font-size: 0.95rem;
            color: var(--color-text-light);
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }

        .story-card .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--color-text-light);
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 1rem;
        }

        .story-card .read-more {
            color: var(--color-gold);
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .story-card .read-more:hover {
            color: var(--color-primary);
        }

        /* ============================================
           CATÉGORIES D'HISTOIRES
           ============================================ */
        .categories-section {
            background: var(--color-paper);
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .category-card {
            background: var(--color-white);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            cursor: pointer;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .category-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .category-card h3 {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .category-card p {
            font-size: 0.9rem;
            color: var(--color-text-light);
        }

        /* ============================================
           RÉSUMÉS DE LIVRES
           ============================================ */
        .books-section {
            background: var(--color-white);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .book-card {
            display: flex;
            flex-direction: column;
            background: var(--color-cream);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .book-cover {
            height: 280px;
            background: linear-gradient(145deg, #2c3e50, var(--color-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .book-spine {
            width: 160px;
            height: 220px;
            background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            border-radius: 4px;
            box-shadow: 
                2px 2px 5px rgba(0,0,0,0.3),
                inset 2px 0 3px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        .book-spine::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(201, 169, 110, 0.3);
        }

        .book-spine .book-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-gold);
            text-align: center;
            line-height: 1.3;
        }

        .book-spine .book-author {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            margin-top: 0.5rem;
            text-align: center;
        }

        .book-info {
            padding: 1.8rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .book-info h3 {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 0.3rem;
        }

        .book-info .author {
            font-size: 0.9rem;
            color: var(--color-gold);
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .book-info p {
            font-size: 0.95rem;
            color: var(--color-text-light);
            line-height: 1.6;
            flex-grow: 1;
        }

        .book-rating {
            display: flex;
            gap: 2px;
            margin-top: 1rem;
            color: var(--color-gold);
            font-size: 1.1rem;
        }

        /* ============================================
           PUBLICATIONS
           ============================================ */
        .publications-section {
            background: var(--color-paper);
        }

        .publication-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .publication-item {
            background: var(--color-white);
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            transition: var(--transition);
        }

        .publication-item:hover {
            box-shadow: var(--shadow-hover);
            transform: translateX(5px);
        }

        .pub-date {
            min-width: 80px;
            text-align: center;
            padding: 0.8rem;
            background: var(--color-cream);
            border-radius: 10px;
        }

        .pub-date .day {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
        }

        .pub-date .month {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-light);
            margin-top: 0.2rem;
        }

        .pub-content h3 {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .pub-content p {
            color: var(--color-text-light);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .pub-tag {
            display: inline-block;
            margin-top: 0.8rem;
            padding: 4px 12px;
            background: rgba(201, 169, 110, 0.15);
            color: var(--color-gold);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* ============================================
           À PROPOS
           ============================================ */
        .about-section {
            background: var(--color-white);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h2 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--color-primary);
            margin-bottom: 1.5rem;
        }

        .about-text p {
            font-size: 1.05rem;
            color: var(--color-text-light);
            margin-bottom: 1.2rem;
            line-height: 1.8;
        }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 2.5rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-gold);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--color-text-light);
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .about-visual {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border-radius: 20px;
            padding: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        .about-visual::before {
            content: '"';
            font-family: var(--font-serif);
            font-size: 20rem;
            color: rgba(201, 169, 110, 0.1);
            position: absolute;
            top: -3rem;
            left: 1rem;
            line-height: 1;
        }

        .about-visual blockquote {
            color: var(--color-white);
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-style: italic;
            line-height: 1.6;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .about-visual cite {
            display: block;
            margin-top: 1.5rem;
            font-size: 1rem;
